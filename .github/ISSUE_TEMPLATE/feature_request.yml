name: 💡 Feature Request
description: Suggest a new idea or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Let’s hear it ✨

  - type: textarea
    id: idea
    attributes:
      label: 💡 Idea
      description: What do you want to add?
      placeholder: Add new simulation...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 🎯 Why is it needed?
      description: Explain the purpose
      placeholder: It improves usability...

  - type: textarea
    id: solution
    attributes:
      label: 🛠️ Possible solution
      description: How could this be implemented?

  - type: textarea
    id: notes
    attributes:
      label: 📎 Additional context
